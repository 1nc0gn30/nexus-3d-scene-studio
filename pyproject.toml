[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-3d-scene-studio"
version = "1.0.0"
description = "Pure Python stdlib 3D graphics studio, parametric geometry engine, Model Context Protocol (MCP) server, and WebGL scene exporter"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Nexus 3D Scene Studio Contributors" }
]
keywords = [
    "3d", "graphics", "procedural-generation", "mcp", "model-context-protocol",
    "geometry", "tesseract", "torus-knot", "superquadric", "threejs",
    "webgl", "wavefront-obj", "stl", "material-design-3",
    "sdf", "signed-distance-field", "marching-tetrahedra", "isosurface",
    "tpms-gyroid", "csg-booleans"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
nexus-3d = "nexus_3d_scene_studio.cli:main"
scene-studio = "nexus_3d_scene_studio.cli:main"

[project.urls]
Homepage = "https://github.com/nexus-3d/nexus-3d-scene-studio"
Documentation = "https://github.com/nexus-3d/nexus-3d-scene-studio#readme"
Repository = "https://github.com/nexus-3d/nexus-3d-scene-studio"
Issues = "https://github.com/nexus-3d/nexus-3d-scene-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["public/**/*", "public/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
