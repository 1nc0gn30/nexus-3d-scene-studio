name: CI

on:
  push:
    branches: [ main, master, "releases/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Upgrade pip and install core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov

      - name: Install package in editable mode
        run: |
          python -m pip install -e .

      - name: Run test suite with pytest
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v --tb=short

      - name: Verify CLI execution
        run: |
          python -m nexus_3d_scene_studio --help || python -c "import nexus_3d_scene_studio; print('Nexus 3D imported successfully')"

      - name: Test Gallery Generation Script
        run: |
          python examples/procedural-shapes/generate_gallery.py

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 mypy build

      - name: Run syntax & style check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Check package build distribution
        run: |
          python -m build
